<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Updated Title to reflect ElementOS -->
    <title>ElementOS</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://jsdelivr.net"></script>
    <!-- Matrix JavaScript SDK -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background: url('https://unsplash.com') center/cover; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans select-none text-white">

    <!-- 1. LOGIN / USER CREATION SCREEN -->
    <div id="login-screen" class="absolute inset-0 bg-black/70 backdrop-blur-md flex flex-col items-center justify-center z-50">
        <div class="bg-gray-900/80 p-8 rounded-2xl w-96 border border-white/10 shadow-2xl text-center">
            <div class="w-24 h-24 bg-teal-600 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold shadow-lg">🟢</div>
            <!-- Updated Heading -->
            <h2 class="text-xl font-semibold mb-6">Sign in to ElementOS</h2>
            <input id="login-homeserver" type="text" value="https://matrix.org" class="w-full bg-white/10 p-3 rounded-lg mb-3 border border-white/10 text-white placeholder-gray-400 focus:outline-none focus:border-teal-500" placeholder="Homeserver">
            <input id="login-username" type="text" class="w-full bg-white/10 p-3 rounded-lg mb-3 border border-white/10 text-white placeholder-gray-400 focus:outline-none focus:border-teal-500" placeholder="Username (e.g. @alice:matrix.org)">
            <input id="login-password" type="password" class="w-full bg-white/10 p-3 rounded-lg mb-6 border border-white/10 text-white placeholder-gray-400 focus:outline-none focus:border-teal-500" placeholder="Password">
            <button id="btn-login" class="w-full bg-teal-600 hover:bg-teal-500 py-3 rounded-lg font-medium transition shadow-lg shadow-teal-600/30">Sign In / Connect</button>
        </div>
    </div>

    <!-- 2. DESKTOP ENVIRONMENT -->
    <main id="desktop" class="w-full h-full relative hidden">
        <!-- Floating Chat Window -->
        <div id="chat-window" class="hidden absolute top-20 left-20 w-[450px] h-[550px] bg-gray-900/95 border border-white/10 rounded-xl shadow-2xl flex flex-col z-30 overflow-hidden backdrop-blur-xl">
            <div class="bg-gray-800/80 px-4 py-3 border-b border-white/10 flex justify-between items-center">
                <span id="chat-title" class="font-medium text-sm text-gray-200">Chat</span>
                <button onclick="toggleElement('chat-window')" class="text-gray-400 hover:text-white text-lg">&times;</button>
            </div>
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm"></div>
            <div class="p-3 border-t border-white/10 flex gap-2 bg-gray-950/40">
                <input id="chat-input" type="text" placeholder="Type a message..." class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
                <button id="btn-send" class="bg-teal-600 hover:bg-teal-500 px-4 py-2 rounded-lg text-sm font-medium">Send</button>
            </div>
        </div>
    </main>

    <!-- 3. CHROMEBOOK-STYLE FANCY FRIENDS PANEL -->
    <div id="friends-panel" class="hidden absolute bottom-16 right-4 w-80 max-h-[480px] bg-gray-900/90 border border-white/10 rounded-2xl shadow-2xl backdrop-blur-xl flex flex-col z-40 overflow-hidden transition-all duration-200 transform translate-y-2">
        <div class="p-4 border-b border-white/10 flex justify-between items-center bg-white/5">
            <h3 class="font-semibold text-base tracking-wide">Contacts & Friends</h3>
            <button id="btn-show-add-friend" class="w-8 h-8 rounded-full bg-teal-600 hover:bg-teal-500 flex items-center justify-center font-bold text-lg shadow-md transition">+</button>
        </div>
        
        <div id="add-friend-ui" class="hidden p-4 border-b border-white/10 bg-gray-950/50 space-y-2">
            <input id="friend-mxid" type="text" placeholder="@username:server.com" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-teal-500">
            <div class="flex gap-2">
                <button id="btn-add-friend" class="flex-1 bg-teal-600 text-xs py-2 rounded-lg font-medium">Add Friend</button>
                <button onclick="toggleElement('add-friend-ui')" class="bg-white/10 text-xs px-3 py-2 rounded-lg">Cancel</button>
            </div>
        </div>

        <div id="friends-list" class="flex-1 overflow-y-auto p-2 space-y-1 min-h-[200px]">
            <p class="text-xs text-gray-400 text-center py-8">Loading ElementOS inner circle...</p>
        </div>

        <!-- Add a Logout Button at the bottom of the Friends panel -->
        <div class="p-2 border-t border-white/10 bg-gray-950/20 text-center">
            <button id="btn-logout" class="text-xs text-red-400 hover:text-red-300 transition">Disconnect Account</button>
        </div>
    </div>

    <!-- 4. BOTTOM TASKBAR -->
    <footer class="absolute bottom-0 left-0 right-0 h-14 bg-gray-950/70 border-t border-white/10 flex justify-between items-center px-4 backdrop-blur-lg z-40">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center font-bold hover:bg-white/20 cursor-pointer">🟢</div>
        </div>
        
        <button id="taskbar-profile" class="flex items-center gap-3 bg-white/5 hover:bg-white/10 border border-white/5 rounded-full pl-2 pr-4 py-1.5 transition active:scale-95">
            <div id="user-avatar" class="w-7 h-7 bg-gradient-to-tr from-teal-500 to-emerald-600 rounded-full flex items-center justify-center text-xs font-bold shadow-inner">E</div>
            <span id="user-displayname" class="text-sm font-medium text-gray-200">Profile</span>
        </button>
    </footer>

</body>
</html>
